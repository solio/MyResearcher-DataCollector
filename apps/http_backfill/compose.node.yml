# Standalone collector preset: no per-node .env, nginx or domain required.
# Same directory/service/data path as compose.yml to preserve an existing node.
services:
  collector-console:
    build:
      context: ../..
      dockerfile: apps/http_backfill/Dockerfile
      args:
        BASE_IMAGE: ${BACKFILL_BASE_IMAGE:-fangzuzu-docker-registry-vpc.cn-guangzhou.cr.aliyuncs.com/fangzuzu/python:3.12-slim}
    restart: unless-stopped
    ports:
      - "${BACKFILL_BIND_ADDRESS:-0.0.0.0}:${BACKFILL_PORT:-8790}:8790"
    environment:
      BACKFILL_COOKIE_PATH: /
      BACKFILL_API_ONLY: "1"
      BACKFILL_FLEET_SYNC_ENABLED: "0"
    volumes:
      - ./data:/data
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
