[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myresearcher-data-collector"
version = "0.0.0"
description = "Traceable external raw-data acquisition boundary for MyResearcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]

[project.scripts]
myresearcher-collector = "myresearcher_collector.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
